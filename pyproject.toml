[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jamesnaffi-guidecover"
version = "0.1.0"
description = "把样本特征与指引条目匹配，标出无指引可依的样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jamesnaffi" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jamesnaffi.github.io"
Repository = "https://github.com/jamesnaffi/guidecover"
Issues = "https://github.com/jamesnaffi/guidecover/issues"

[project.scripts]
guidecover = "guidecover:main"

[tool.setuptools]
py-modules = ["guidecover"]
